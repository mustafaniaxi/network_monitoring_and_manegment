[project]
name = "netmon"
version = "1.0.0"
description = "Network Monitoring and Management System - backend API and monitoring engine"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "NetMon contributors" }]
classifiers = [
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
    "fastapi>=0.146.0",
    "uvicorn[standard]>=0.54.0",
    "sqlalchemy[asyncio]>=2.1.5",
    "asyncpg>=0.32.0",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "python-multipart>=0.0.9",
    "pyjwt>=2.9",
    "pwdlib[argon2]>=0.3.1",
    "icmplib>=3.0",
    "pysnmp>=7.1",
    "cryptography>=43",  # SNMPv3 privacy (AES/DES)
    "psutil>=6.0",
    "prometheus-client>=0.21",
    "httpx>=0.27",
]

[project.scripts]
netmon = "netmon.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.17.1",
    "mypy>=2.4.0",
    "types-psutil>=6.0",
]

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["netmon"]

# --------------------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["netmon/db/migrations/versions"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "UP",       # pyupgrade
    "B",        # bugbear
    "SIM",      # simplify
    "ASYNC",    # async pitfalls
    "C4",       # comprehensions
    "PT",       # pytest style
    "RUF",      # ruff-specific
    "S",        # bandit (security)
]
ignore = [
    "B008",     # FastAPI's Depends() in defaults is idiomatic
    "S101",     # assert is fine in tests
    "S311",     # random is used for simulation, not cryptography
    "RUF012",   # mutable class attrs on pydantic/sqlalchemy models
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "PT018"]

# --------------------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
strict = true
warn_unreachable = true
disallow_subclassing_any = false
disallow_untyped_decorators = false
exclude = ["netmon/db/migrations/"]

[[tool.mypy.overrides]]
module = ["pysnmp.*", "icmplib.*", "prometheus_client.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

# --------------------------------------------------------------------------- pytest
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["snmp: integration tests that start a local net-snmp agent (skipped if snmpd is missing)"]
filterwarnings = [
    "ignore::DeprecationWarning:pysnmp.*",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.coverage.run]
source = ["netmon"]
concurrency = ["greenlet", "thread"]
omit = ["netmon/db/migrations/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
